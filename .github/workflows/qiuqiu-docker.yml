name: QiuQiu Docker

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['qiuqiu-v*']
    paths:
      - '.github/workflows/qiuqiu-docker.yml'
      - 'qiuqiu/**'
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'web/**'
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements.txt'

permissions:
  contents: read

concurrency:
  group: qiuqiu-docker-publish
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'dlaq/qiuqiu-push-server' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/qiuqiu-v'))
    name: Build and test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      DOCKERHUB_NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Docker Hub configuration
        shell: bash
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_NAMESPACE" || { echo 'Missing DOCKERHUB_USERNAME'; exit 1; }
          test -n "$DOCKERHUB_TOKEN" || { echo 'Missing DOCKERHUB_TOKEN'; exit 1; }
          [[ "$DOCKERHUB_NAMESPACE" =~ ^[a-z0-9][a-z0-9_-]*$ ]] || { echo 'Invalid Docker Hub namespace'; exit 1; }
      - name: Docker Hub login
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build Gateway and admin
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: qiuqiu
          file: qiuqiu/deploy/Dockerfile.gateway
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: qiuqiu-ci-gateway:test
          labels: |
            org.opencontainers.image.source=https://github.com/dlaq/qiuqiu-push-server
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=gateway-${{ matrix.arch }}
          cache-to: type=gha,scope=gateway-${{ matrix.arch }},mode=max
      - name: Build QiuQiu ntfy
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: qiuqiu/deploy/Dockerfile.ntfy
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: qiuqiu-ci-ntfy:test
          labels: |
            org.opencontainers.image.source=https://github.com/dlaq/qiuqiu-push-server
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=ntfy-${{ matrix.arch }}
          cache-to: type=gha,scope=ntfy-${{ matrix.arch }},mode=max
      - name: Run native container integration
        run: python3 qiuqiu/scripts/test-images.py
        env:
          QQ_EXPECTED_ARCH: ${{ matrix.arch }}
      - name: Push tested architecture images
        shell: bash
        run: |
          for component in gateway ntfy; do
            image="${DOCKERHUB_NAMESPACE}/qiuqiu-push-${component}:sha-${GITHUB_SHA}-${{ matrix.arch }}"
            docker tag "qiuqiu-ci-${component}:test" "$image"
            docker push "$image"
          done

  publish:
    name: Publish multi-platform manifests
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DOCKERHUB_NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Merge and verify both architectures
        run: python3 qiuqiu/scripts/publish-images.py
      - name: Save public image references and digests
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: docker-publication
          path: docker-publication.json
          retention-days: 90
