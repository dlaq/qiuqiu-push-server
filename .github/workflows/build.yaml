name: build
on:
  push:
    branches: [ main ]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: '.go-version'
      - name: Install node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: './web/package-lock.json'
      - name: Install dependencies
        if: github.repository == 'binwiederhier/ntfy'
        timeout-minutes: 10 # A stalled apt mirror must fail the run, not hang it
        run: make build-deps-ubuntu
      - name: Check native build dependencies
        if: github.repository != 'binwiederhier/ntfy'
        run: |
          gcc --version
          python3 -m venv venv
          venv/bin/python -m pip --version
      - name: Build all the things
        if: github.repository == 'binwiederhier/ntfy'
        run: make build
      - name: Build fork native server
        # The QiuQiu Docker workflow builds AND runs tests on native amd64 and
        # arm64 runners. Keep this inherited job as an independent native build.
        if: github.repository != 'binwiederhier/ntfy'
        run: make web docs cli-linux-server
      - name: Print build results and checksums
        if: github.repository == 'binwiederhier/ntfy'
        run: make cli-build-results
      - name: Print native build checksum
        if: github.repository != 'binwiederhier/ntfy'
        run: sha256sum dist/ntfy_linux_server/ntfy
  docker-build:
    # Dockerfile-build is not used in releases, so build it here to catch it going stale (see #1962)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build Dockerfile-build
        run: docker build --file Dockerfile-build --tag ntfy-build .
      - name: Run the image
        run: docker run --rm ntfy-build --help
