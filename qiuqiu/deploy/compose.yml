name: qiuqiu-push
services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      PUSH_DOMAIN: ${PUSH_DOMAIN:?set PUSH_DOMAIN}
      NTFY_DOMAIN: ${NTFY_DOMAIN:?set NTFY_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [gateway]
    networks: [edge]
  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.gateway
    restart: unless-stopped
    environment:
      QQ_NTFY_URL: http://ntfy:80
      QQ_NTFY_PUBLIC_URL: https://${NTFY_DOMAIN}
      QQ_NTFY_HOST: ${NTFY_DOMAIN}
      QQ_ADMIN_PASSWORD_FILE: /run/secrets/admin_password
      QQ_NTFY_ADMIN_PASSWORD_FILE: /run/secrets/ntfy_admin_password
      QQ_NTFY_ADMIN_SOCKET: /run/ntfy/admin.sock
      QQ_CALLBACK_ALLOWLIST: ${QQ_CALLBACK_ALLOWLIST:-}
    secrets: [admin_password, ntfy_admin_password]
    volumes:
      - gateway_data:/data
      - ntfy_socket:/run/ntfy
    depends_on: [ntfy]
    networks: [edge, backend]
  ntfy:
    build:
      context: ../..
      dockerfile: qiuqiu/deploy/Dockerfile.ntfy
    restart: unless-stopped
    environment:
      NTFY_BASE_URL: https://${NTFY_DOMAIN}
      NTFY_LISTEN_HTTP: :80
      NTFY_EXPERIMENTAL_LISTEN_ADMIN_UNIX: /run/ntfy/admin.sock
      NTFY_AUTH_FILE: /var/lib/ntfy/auth.db
      NTFY_AUTH_DEFAULT_ACCESS: deny-all
      NTFY_CACHE_FILE: /var/lib/ntfy/cache.db
      NTFY_CACHE_DURATION: 168h
      NTFY_MESSAGE_SIZE_LIMIT: 64k
      NTFY_ATTACHMENT_CACHE_DIR: /var/lib/ntfy/attachments
      NTFY_ENABLE_LOGIN: "true"
      NTFY_ENABLE_SIGNUP: "false"
      NTFY_BEHIND_PROXY: "true"
    secrets: [ntfy_admin_hash]
    volumes:
      - ntfy_data:/var/lib/ntfy
      - ntfy_socket:/run/ntfy
    networks: [backend]
networks:
  edge:
  backend:
volumes:
  caddy_data:
  caddy_config:
  gateway_data:
  ntfy_data:
  ntfy_socket:
secrets:
  admin_password:
    file: ./secrets/admin_password
  ntfy_admin_password:
    file: ./secrets/ntfy_admin_password
  ntfy_admin_hash:
    file: ./secrets/ntfy_admin_hash
